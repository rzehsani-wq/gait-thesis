
# Example config (you can override by CLI)
data:
  csv: data/casia-b_pose_coco.csv
  seq_len: 30
  stride: 30
  conf_thr: 0.5

ssl:
  d_model: 128
  epochs: 50
  batch_size: 64
  lr: 0.0003
  save: ckpts/ssl_best.pt

id:
  steps: 1500
  batch_size: 64
  lr_head: 0.0003
  lr_backbone: 0.0001
  region: ALL
  fusion: avg
